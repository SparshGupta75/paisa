name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Dependency audit (informational)
        # Known build-tooling advisories are documented in docs/SECURITY.md.
        # Do not fail the build on them, and never run `npm audit fix --force`.
        continue-on-error: true
        run: npm audit --audit-level=high

  bundle:
    name: iOS bundle
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-bundle
          path: dist
          retention-days: 7
